<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mail Link Defender — popup de alto risco</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f3f5f8; }
      * { box-sizing: border-box; }
      body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
      main { display: grid; width: 100%; height: 100%; grid-template-columns: 1fr 430px; align-items: center; gap: 72px; padding: 72px 92px; }
      .copy { align-self: center; }
      .eyebrow { margin: 0 0 12px; color: #b42318; font-size: 14px; font-weight: 750; }
      h1 { max-width: 620px; margin: 0; font-size: 54px; line-height: 1.03; letter-spacing: -.045em; }
      .lead { max-width: 560px; margin: 20px 0 34px; color: #667085; font-size: 18px; line-height: 1.55; }
      .mail { width: min(600px, 100%); padding: 22px 24px; border: 1px solid #dce2ea; border-radius: 14px; background: #fff; }
      .mail-label { margin: 0 0 6px; color: #667085; font-size: 12px; }
      .mail-title { margin: 0 0 18px; font-size: 17px; }
      .mail-link { display: inline-flex; align-items: center; gap: 6px; color: #155eaa; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
      .mail-link::after { display: grid; width: 16px; height: 16px; place-items: center; border-radius: 50%; background: #c43d36;
        color: #fff; content: "!"; font-size: 10px; font-weight: 800; text-decoration: none; }
      .popup-frame { width: 372px; height: 493px; justify-self: end; overflow: hidden; border: 0; box-shadow: 0 24px 64px rgba(23,32,51,.22); }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <p class="eyebrow">PROTEÇÃO AUTOMÁTICA NO GMAIL</p>
        <h1>O risco aparece antes do clique.</h1>
        <p class="lead">A interface muda com o resultado da análise e mostra quando um link merece atenção imediata.</p>
        <div class="mail">
          <p class="mail-label">Mensagem de demonstração</p>
          <p class="mail-title"><strong>Confirme sua conta para continuar</strong></p>
          <span class="mail-link">Entrar no PayPal</span>
        </div>
      </section>
      <iframe class="popup-frame" src="/src/popup/index.html?preview=gmail-high" title="Popup do Mail Link Defender em estado de alta suspeita"></iframe>
    </main>
  </body>
</html>
