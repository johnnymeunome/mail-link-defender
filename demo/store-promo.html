<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mail Link Defender — arte promocional</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #fff; background: #172b4d; }
      * { box-sizing: border-box; }
      body { width: 100vw; height: 100vh; margin: 0; overflow: hidden; }
      main { position: relative; display: flex; width: 100%; height: 100%; align-items: center; justify-content: space-between;
        gap: 28px; padding: clamp(28px, 6vw, 84px); background: linear-gradient(125deg, #172b4d 0 58%, #b42318 58% 100%); }
      .brand { display: flex; max-width: 760px; align-items: center; gap: clamp(16px, 3vw, 28px); }
      .brand img { width: clamp(68px, 9vw, 112px); height: clamp(68px, 9vw, 112px); flex: none; border-radius: 24%; }
      h1 { margin: 0 0 7px; font-size: clamp(27px, 4vw, 54px); line-height: 1; letter-spacing: -.035em; }
      p { margin: 0; color: rgba(255,255,255,.76); font-size: clamp(12px, 1.7vw, 20px); }
      .shield { width: clamp(92px, 17vw, 220px); height: auto; flex: none; }
      .shield-shape { fill: #fff; }
      .shield-mark { fill: none; stroke: #b42318; stroke-linecap: round; stroke-width: 2.2; }
      @media (max-width: 600px) {
        main { gap: 14px; padding: 26px; }
        .brand { align-items: flex-start; flex-direction: column; gap: 12px; }
        .brand img { width: 64px; height: 64px; }
        h1 { max-width: 220px; font-size: 27px; }
        p { max-width: 220px; font-size: 12px; }
        .shield { width: 96px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/icons/icon-128.png" alt="" />
        <div>
          <h1>Mail Link Defender</h1>
          <p>Entenda o destino antes do clique.</p>
        </div>
      </div>
      <svg class="shield" viewBox="0 0 24 24" aria-hidden="true">
        <path class="shield-shape" d="M12 2.5 20 6v6.1c0 5-3.3 8.1-8 9.9-4.7-1.8-8-4.9-8-9.9V6l8-3.5Z"></path>
        <path class="shield-mark" d="M12 7.3v6.5M12 17.2h.01"></path>
      </svg>
    </main>
  </body>
</html>
