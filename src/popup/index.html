<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail Link Defender</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body data-scan-state="idle">
    <main class="app-shell">
      <header class="app-header">
        <img class="logo" src="/icons/icon-48.png" alt="" aria-hidden="true" />
        <div class="brand-copy">
          <h1>Mail Link Defender</h1>
          <p class="tagline">Entenda o destino antes do clique.</p>
        </div>
      </header>

      <section id="protection-card" class="protection-row" hidden>
        <div class="protection-copy">
          <div class="provider-heading">
            <span class="provider-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M3.5 5.5h13v9h-13zM4 6l6 4.5L16 6" />
              </svg>
            </span>
            <div>
              <h2 id="provider-title">Gmail</h2>
              <div class="status-line">
                <span id="protection-dot" class="status-dot" aria-hidden="true"></span>
                <span id="protection-status">Proteção ativa</span>
              </div>
            </div>
          </div>
          <p id="provider-description">Verifica os links do e-mail antes de você clicar.</p>
        </div>
        <label class="switch" aria-label="Ativar proteção automática no Gmail">
          <input id="provider-toggle" type="checkbox" />
          <span></span>
        </label>
      </section>

      <section class="scan-section">
        <button id="scan-page" class="scan-button" type="button" aria-label="Verificar links desta página">
          <svg class="scan-icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" />
            <path class="scan-sweep" d="M8.5 8.5V4" />
            <path d="m12.5 12.5 4 4" />
          </svg>
        </button>
        <p id="scan-action-label" class="scan-action-label">Verificar esta página</p>
        <p id="scan-summary" class="scan-summary" aria-live="polite"></p>
      </section>

      <div class="section-divider"><span>Análise avulsa</span></div>

      <form id="url-form" class="url-form" autocomplete="off">
        <label for="url-input">Cole um endereço para analisar</label>
        <div class="input-row">
          <input id="url-input" type="text" inputmode="url" placeholder="https://exemplo.com" aria-label="Endereço do link" />
          <button type="submit" aria-label="Analisar link">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 10h12M11.5 5.5 16 10l-4.5 4.5" />
            </svg>
          </button>
        </div>
      </form>

      <section id="result" class="result" aria-live="polite" hidden>
        <div class="result-header">
          <span id="risk-indicator" class="risk-indicator" aria-hidden="true"></span>
          <div>
            <p class="result-kicker">Resultado da análise</p>
            <h2 id="risk-heading" class="risk-heading"></h2>
          </div>
        </div>
        <div class="domain-block">
          <p class="domain-label">Destino real</p>
          <p id="real-domain" class="real-domain"></p>
        </div>
        <dl id="domain-details" class="domain-details"></dl>
        <ul id="findings" class="findings"></ul>
        <div id="clean-actions" class="clean-actions" hidden>
          <button id="copy-clean" type="button">Copiar link sem rastreadores</button>
        </div>
      </section>

      <p class="privacy-note">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6.5 9V6.8a3.5 3.5 0 0 1 7 0V9M5 9h10v7H5z" />
        </svg>
        Análise local. Nenhum link é enviado ou armazenado.
      </p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
